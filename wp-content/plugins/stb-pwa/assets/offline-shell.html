<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Storbystand – Offline</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				margin: 0;
				padding: 3rem 1.5rem;
				text-align: center;
				background: #0f172a;
				color: #f8fafc;
			}
			.card {
				max-width: 480px;
				margin: 0 auto;
				padding: 2rem;
				border-radius: 1rem;
				background: rgba(15, 23, 42, 0.85);
				box-shadow: 0 10px 45px rgba(3, 7, 18, 0.6);
			}
			h1 {
				font-size: 1.75rem;
				margin-bottom: 0.5rem;
			}
			p {
				margin-top: 0;
				line-height: 1.6;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<h1>You're offline</h1>
			<p>The Storbystand dashboard will refresh automatically when the connection is back. Recent data is cached locally for quick access.</p>
		</div>
	</body>
</html>
